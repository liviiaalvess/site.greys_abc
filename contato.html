<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Greys ABC</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/icon.png">
<body>
    <header>
        <div class="container">
            <div class="logo">
              <a href="index.html"><img class="logo" src="img/logoofc.png" alt="logo de IA"> </a>     
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="index.html#sobre">Curiosidades</a></li>
                    <li><a href="index.html#premios">Premios</a></li>
                    <li><a href="index.html #perssonagens">Personagens</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section id="inicio" class="bannercontato">

    </section>
    <main>
        <section id="contato"> 
            <div class="container">
                <h1 class="centraliza">Contato</h1>
                <form class="formulario-contato" action="https://formsubmit.co/liviaalvesetec25@gmail.com" method="post">
                    <div class="grupo-form">
                      <label for="nome">Nome completo:</label>
                      <input type="text" id="nome" name="nome" required>
                    </div>
              
                    <div class="grupo-form">
                      <label for="email">E-mail:</label>
                      <input type="email" id="email" name="email" required>
                    </div>
              
                    <div class="grupo-form">
                      <label for="idade">Idade:</label>
                      <input type="number" id="idade" name="idade" min="10" max="120">
                    </div>
              
                    <div class="grupo-form">
                      <label for="nome">Instagram:</label>
                      <input type="text" id="nome" name="nome" required>
                    </div>
              
                    <div class="grupo-form">
                      <label for="area">Já assistiu a série?</label>
                      <select id="area" name="area">
                        <option value="ml">Sim, toda</option>
                        <option value="cv">Não</option>
                        <option value="pln">Pretendo</option>
                        <option value="generativa">Não terminei ainda</option>
                      </select>
                    </div>
              
                    <div class="grupo-form">
                      <label>Quanto você gostou?:</label>
                      <input type="range" min="0" max="100" name="interesse">
                    </div>
              
                    <div class="grupo-form">
                      <label>Gênero:</label>
                      <input type="radio" name="genero" value="feminino"> Feminino
                      <input type="radio" name="genero" value="masculino"> Masculino
                      <input type="radio" name="genero" value="outro"> Outro
                    </div>
              
                    <div class="grupo-form">
                      <label>Qual área você faria?</label>
                      <input type="checkbox" name="uso[]" value="cardio"> Cardiologia
                      <input type="checkbox" name="uso[]" value="nauro"> Neurologia
                      <input type="checkbox" name="uso[]" value="geral"> Geral
                      <input type="checkbox" name="uso[]" value="ped"> Pediatria
                    </div>
              
                    <div class="grupo-form">
                      <label for="cor"> Qual cor seria seu estetoscopio?:</label>
                      <input type="color" id="cor" name="cor">
                    </div>
              
                    <div class="grupo-form">
                      <label for="mensagem">Mensagem:</label>
                      <textarea id="mensagem" name="mensagem" rows="20"></textarea>
                    </div>
              
                    <div class="grupo-form centraliza">
                      <button type="submit" class="btn">Enviar</button>
                      <input type="hidden" name="_captcha" value="false"> 
                      <input type="hidden" name="_next" value="https://liviiaalvess.github.io/site.greys_abc/enviadoo.html">       
                                 
                    </div>
                  </form>
                </div>               
            </div>
        </section>
       
       
        
    </main>
    <footer>
      <p class="centraliza">Desenvolvidos por Lívia Alves - 2025</p>
    </footer>      
</body>

</html>
